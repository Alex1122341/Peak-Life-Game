name: Verify playable game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check visual.js
      - name: Install DOM test runtime
        run: npm install --no-save --no-audit --no-fund --package-lock=false jsdom@26
      - name: Test time, character animation, economy, events and views
        run: node tests/browser-smoke.cjs
