let s=null, gallery={achievements:[],endings:[]}, tab='home', modal=null, options={gender:'男',origin:'scholar',trait:'steady'}, toastTimer=null;
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const fmt=n=>Math.round(Number(n)||0).toLocaleString('zh-CN');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storeGet=(k)=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}};
const storePut=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}};
const rnd=()=>{s.seed=(Math.imul(s.seed,1664525)+1013904223)|0;return(s.seed>>>0)/4294967296};
const ri=(a,b)=>Math.floor(rnd()*(b-a+1))+a;
const chance=p=>rnd()<p;
const countShops=x=>Object.values(x.shops||{}).reduce((a,b)=>a+Number(b||0),0);
const npcid=id=>NPCS.find(n=>n.id===id);
const hasRetainer=id=>s.retainers.includes(id);
const annualWage=()=>{if(s.age<18)return 0;let job=JOBS[s.job],rank=s.ranks[s.job]||0;return job.base+rank*job.step+Math.floor(s.stats[job.stat]/7)};
const annualShops=()=>{let gross=SHOPS.reduce((v,x)=>v+(s.shops[x.id]||0)*x.income,0);return Math.round(gross*(hasRetainer('steward')?1.15:1))};
const annualExpense=()=>s.age<18?0:65+s.children.length*24+(s.spouse?30:0)+HOMES[s.house].upkeep+s.retainers.reduce((v,id)=>v+RETAINERS.find(x=>x.id===id).salary,0);
const log=(text,category='记事')=>{s.logs.unshift({year:s.year,age:s.age,text,category});if(s.logs.length>120)s.logs.length=120};
const apply=(delta={})=>{Object.entries(delta).forEach(([k,v])=>{if(k==='wis'||k==='force'||k==='charm'||k==='virtue')s.stats[k]=clamp(s.stats[k]+v,0,300);else if(k==='silver')s.silver+=v;else if(k==='health'||k==='mood')s[k]=clamp(s[k]+v,0,100);else if(k==='fame')s[k]=clamp(s[k]+v,0,9999);else if(k==='luck')s[k]=clamp(s[k]+v,0,100);else if(k==='blessings')s[k]=Math.max(0,s[k]+v);else if(typeof s[k]==='number')s[k]+=v})};
function createState(name,gender,origin,trait){let o=ORIGINS[origin],t=TRAITS[trait];let state={version:1,seed:((Date.now()^Math.floor(Math.random()*2000000))|0)||2026,name,gender,origin,trait,age:6,year:1,generation:1,silver:o.silver,stats:{wis:o.wis,force:o.force,charm:o.charm,virtue:o.virtue},health:93,mood:78,fame:12,luck:30,ap:0,school:'尚未启蒙',job:o.job,ranks:{scholar:0,merchant:0,farmer:0,soldier:0,healer:0,artisan:0},shops:{},house:0,spouse:null,relations:{yun:0,lin:0,lu:0,qiao:0},children:[],retainers:[],relics:[],blessings:2,claimedYear:0,reforms:0,journeys:0,merit:0,heirCount:0,logs:[],seenEvents:[],event:null,ending:null,gameOver:false,playCount:0};state.stats[t.key]+=t.bonus;return state;}
function save(){if(!s)return;storePut(SAVE,s);storePut(GALLERY,gallery)}
function addAchievement(id){if(!s.achievements)s.achievements=[];if(s.achievements.includes(id))return;s.achievements.push(id);if(!gallery.achievements.includes(id))gallery.achievements.push(id);const x=ACHIEVEMENTS.find(a=>a.id===id);if(x){log('解锁成就：「'+x.name+'」','成就');toast('成就解锁 · '+x.name)}}
function checkAchievements(){if(!s||s.gameOver)return;for(const x of ACHIEVEMENTS)if(x.check(s))addAchievement(x.id)}
function checkState(){if(!s||s.gameOver)return;checkAchievements();if(s.health<=0){if(s.children.some(c=>c.age>=16)){s.event=null;modal={type:'succession'};return}end('demise');return}if(s.silver< -450){end('bankrupt');return}}
function end(id){s.gameOver=true;s.event=null;s.ending=id;gallery.endings=[...new Set([...gallery.endings,id])];log('人生终章：「'+ENDINGS[id].title+'」','结局');save();modal={type:'ending'};render()}
function score(){return Math.max(0,Math.floor(Math.max(s.silver,0)/9+s.fame*2+s.stats.wis*3+s.stats.force*3+s.stats.virtue*4+s.stats.charm*2+s.children.length*90+s.reforms*250+countShops(s)*110+s.generation*350))}
function canEnd(id){return !!({sovereign:()=>s.reforms>=3&&s.fame>=850&&s.stats.wis>=160&&s.stats.force>=150&&s.retainers.length>=3&&s.silver>=2500,minister:()=>s.ranks.scholar>=5&&s.reforms>=2&&s.fame>=580,general:()=>s.ranks.soldier>=5&&s.stats.force>=170&&s.fame>=580,millionaire:()=>s.silver>=20000&&countShops(s)>=4,dynasty:()=>s.generation>=3&&s.fame>=450&&s.children.length>=2,wise:()=>s.stats.virtue>=165&&s.stats.wis>=110&&s.age>=45,wanderer:()=>s.journeys>=14&&s.stats.force>=130&&s.stats.charm>=105,retreat:()=>s.age>=45&&s.silver>=1600&&s.health>=48})[id]?.()}
function chooseFinal(){for(const id of ['sovereign','minister','general','millionaire','dynasty','wise','wanderer','retreat'])if(canEnd(id))return id;return'common'}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2700)}

function needAP(n=1){if(s.ap<n){toast('本年行动次数不足，请进入下一年');return false}return true}

function action(id){if(!needAP())return;const acts={
 study:()=>{if(!spend(18))return false;apply({silver:-18,wis:ri(9,15),mood:-4,fame:3});log('潜心攻读典籍，文思渐长。');return true},
 train:()=>{if(!spend(20))return false;apply({silver:-20,force:ri(9,15),health:3,mood:-3});log('清晨练武，筋骨愈发强健。');return true},
 charity:()=>{if(!spend(65))return false;apply({silver:-65,virtue:ri(10,16),fame:14,mood:4});log('开仓济贫，乡亲感念你的善行。');return true},
 socialize:()=>{if(!spend(26))return false;apply({silver:-26,charm:ri(9,14),fame:7,mood:5});log('赴雅集交游，结识不少新友。');return true},
 heal:()=>{if(!spend(30))return false;apply({silver:-30,health:ri(13,20),mood:9});log('访医问药，身心稍得调养。');return true},
 journey:()=>{if(!spend(70))return false;apply({silver:-70,journeys:1,luck:ri(2,5),mood:7,fame:ri(3,10)});log('踏上游历之途，见天地之广。');if(chance(.38)){apply({silver:ri(60,360),fame:8});log('旅途中帮助过的商人回赠酬谢。','奇遇')}else if(chance(.22)){apply({force:5,health:-6});log('山路遭逢野兽，奋力脱险。','奇遇')}return true},
 work:()=>{let j=JOBS[s.job],rank=s.ranks[s.job];let income=Math.ceil(annualWage()*.42)+ri(0,38);apply({silver:income,[j.stat]:ri(3,7),fame:5+rank*2,mood:-3});log('勤于'+j.name+'，赚得 '+income+' 两银子。','职业');return true},
 bless:()=>{if(s.blessings<=0){toast('祈愿签不足，可每年免费领取');return false}s.blessings--;let keys=['wis','force','charm','virtue'],stat=keys[ri(0,3)];apply({[stat]:ri(10,19),health:6,mood:8,luck:3});log('神前祈愿，冥冥中添了一份助力。','奇遇');return true}
 };const fn=acts[id];if(!fn)return;mutate(()=>{if(fn())s.ap--})}
function claimGift(){if(s.claimedYear===s.year){toast('本年的免费礼包已领取');return}mutate(()=>{s.claimedYear=s.year;apply({silver:80,blessings:2,mood:6});log('领取本年福礼：银两八十两、祈愿签两枚。','福礼');toast('已领取 · 无需看广告')})}
function promotionThreshold(rank){return{stat:[0,47,70,96,132,172][rank],fame:[0,28,75,165,320,580][rank],silver:[0,30,80,180,380,750][rank]}}
function promote(){if(!needAP())return;let current=s.ranks[s.job];if(current>=5){toast('当前职业已达最高阶');return}const t=promotionThreshold(current+1),j=JOBS[s.job];if(s.stats[j.stat]<t.stat||s.fame<t.fame||s.silver<t.silver){toast('未满足晋升条件，请查看下方要求');return}mutate(()=>{s.ap--;apply({silver:-t.silver,fame:30+current*13,mood:10});s.ranks[s.job]++;log('经年累月，终晋升为「'+j.ranks[s.ranks[s.job]]+'」。','官职');toast('晋升成功 · '+j.ranks[s.ranks[s.job]])})}
function switchJob(id){if(!JOBS[id]||id===s.job)return;if(!needAP()||!spend(80))return;mutate(()=>{s.ap--;apply({silver:-80,mood:-3});s.job=id;log('改换前路，投身「'+JOBS[id].name+'」。','职业')})}
function buyShop(id){const x=SHOPS.find(v=>v.id===id);if(!x||!needAP())return;const owned=s.shops[id]||0,price=Math.round(x.cost*(1+owned*.32));if(!spend(price))return;mutate(()=>{s.ap--;apply({silver:-price,fame:8});s.shops[id]=owned+1;log('置办产业：「'+x.name+'」，耗银 '+price+' 两。','家业')})}
function sellShop(id){const x=SHOPS.find(v=>v.id===id);if(!x||(s.shops[id]||0)<1)return;if(!needAP())return;let owned=s.shops[id],resale=Math.round(x.cost*(1+(owned-1)*.32)*.72);mutate(()=>{s.ap--;s.shops[id]--;apply({silver:resale});log('变卖产业：「'+x.name+'」，收回 '+resale+' 两。','家业')})}
function buyHome(tier){if(!HOMES[tier]||tier<=s.house||tier!==s.house+1)return;if(!needAP()||!spend(HOMES[tier].cost))return;mutate(()=>{s.ap--;apply({silver:-HOMES[tier].cost,mood:13,fame:tier*12});s.house=tier;log('迁入新居：「'+HOMES[tier].name+'」。','家业')})}
function buyRelic(id){let x=RELICS.find(v=>v.id===id);if(!x||s.relics.includes(id)||!needAP()||!spend(x.cost))return;mutate(()=>{s.ap--;apply({silver:-x.cost,...x.effect});s.relics.push(id);log('购得传家之物：「'+x.name+'」。','传承')})}
function visitNPC(id){let x=npcid(id);if(!x||!needAP())return;if(!spend(22))return;mutate(()=>{s.ap--;apply({silver:-22,charm:3,mood:5});let increase=ri(18,28)+(s.stats[x.like]>=100?6:0);s.relations[id]=clamp((s.relations[id]||0)+increase,0,100);log('拜访'+x.name+'，相谈甚欢，情谊更深。','人脉')})}

function pickEvent(){
 if(!s||s.gameOver||s.event)return false;
 const milestone=STORY_EVENTS.find(e=>Number.isFinite(e.age)&&e.age===s.age&&!s.seenEvents.includes(e.id));
 const eligible=STORY_EVENTS.filter(e=>!Number.isFinite(e.age)&&(!e.when||e.when(s))).concat(s.age>=18?ORIGINAL_EVENTS.filter(e=>!e.when||e.when(s)):[]);

}

 html='<div class="label">事件人生游玩指南</div><h2 id="modal-title">人生会自己向前走</h2><p><b>自然时间：</b>游戏时间自动流逝，支持暂停、1×、2×、4×。事件出现时暂停，选择后继续。</p><p><b>人生节点：</b>从6岁启蒙、10岁童试、12岁县学、15岁深造，到18岁成年择业，后续在22、27、35、45、55、65、75岁发生重大选择。</p><p><b>全部通过事件：</b>智略、武艺、魅力、德望由故事选择成长；职业、投资、感情和晋升也依靠随机事件，没有行动次数、重复刷任务或一键跳年。</p><p><b>自动经营：</b>成年后俸禄与经营收入每个月自动入账，年底结算生活开销。</p><p><b>保存：</b>每次事件选择和定期自动存档，支持导入与导出。</p>'+btn('返回设置','settings','',true,'full');
}else if(modal.type==='confirm-new'){
 html=`<div class="label">重新开始</div><h2 id="modal-title">开启新的故事？</h2><p>当前人生将被覆盖，但已解锁的跨周目成就和结局会保留。你也可以先在设置中导出备份。</p><div class="split">${btn('暂不','settings','',true,'outline')}${btn('确认重开','do-new','',true,'danger')}</div>`
 }else if(modal.type==='ending'){
 const e=ENDINGS[s.ending];html=`<div class="label">完 · 浮世有终</div><h2 id="modal-title">${e.title}</h2><div class="quote">${e.text}</div><div class="two-cols" style="margin:14px 0"><div class="metric"><b>${fmt(score())}</b><small>本次积分</small></div><div class="metric"><b>${s.age} 岁</b><small>终章年岁</small></div><div class="metric"><b>${s.generation} 代</b><small>家族世代</small></div><div class="metric"><b>${fmt(Math.max(0,s.silver))} 两</b><small>终章财富</small></div></div>${btn('重新书写人生','do-new','',true,'gold full')}<div style="height:8px"></div>${btn('查看人生图鉴','end-record','',true,'outline full')}`
 }else if(modal.type==='succession'){
 let children=s.children.filter(c=>c.age>=16);html=`<div class="label">传承 · 一脉相续</div><h2 id="modal-title">岁月交替</h2><p>你已年迈，家中已有长成的后人。请选择下一代家主，继承大部分家财、所有产业和珍藏，继续新的篇章。</p>${children.map(c=>`<button type="button" class="choice" data-heir="${esc(c.id)}"><b>${esc(c.name)} · ${c.age} 岁</b><small>智 ${c.wis} / 武 ${c.force} / 魅 ${c.charm} / 德 ${c.virtue}</small></button>`).join('')}${btn('以此生为终章','retire-now','',true,'outline full')}`
 }else if(modal.type==='retire'){
 html=`<div class="label">此生抉择</div><h2 id="modal-title">择日归隐</h2><p>若选择结束此生，将根据你已经完成的目标生成结局。也可继续努力，追求新的传奇。</p><div class="split">${btn('继续奋斗','close','',true,'outline')}${btn('确认归隐','retire-now','',true,'gold')}</div>`
 }el.innerHTML=html;requestAnimationFrame(()=>{let focus=el.querySelector('#name-input')||el.querySelector('button:not([disabled])');if(modal?.type!=='create'&&focus)focus.focus({preventScroll:true})})}
function fresh(){s=null;tab='home';options={gender:'男',origin:'scholar',trait:'steady'};modal={type:'create'};render()}
function startGame(){const name=$('#name-input')?.value.trim().replace(/[<>]/g,'').slice(0,8);if(!name){toast('请输入人物姓名');return}s=createState(name,options.gender,options.origin,options.trait);s.achievements=[];log(`${s.name}生于${ORIGINS[s.origin].name}，今年六岁，即将入塾启蒙。`,'开篇');checkAchievements();tab='home';modal=null;pickEvent();save();render()}
function exportSave(){const data={schema:'fushi-life-backup-v1',savedAt:new Date().toISOString(),game:s,gallery};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='浮世一生-存档-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('存档已导出')}
function validateSave(v){return v&&v.version===1&&typeof v.name==='string'&&v.name.length<=20&&Number.isFinite(v.year)&&v.year>=1&&v.year<5000&&v.age>=0&&v.age<200&&v.stats&&Object.values(['wis','force','charm','virtue']).every(k=>Number.isFinite(v.stats[k]))&&JOBS[v.job]&&typeof v.silver==='number'&&v.ranks&&v.shops&&Array.isArray(v.children)&&Array.isArray(v.retainers)&&Array.isArray(v.relics)&&Array.isArray(v.logs)&&Array.isArray(v.seenEvents)&&typeof v.ap==='number'}
async function importSave(file){if(!file)return;try{if(file.size>500000){toast('存档文件超过500KB，已拒绝');return}let data=JSON.parse(await file.text());if(data.schema!=='fushi-life-backup-v1'||!validateSave(data.game))throw Error('存档格式不正确');const g=data.gallery;if(g&&Array.isArray(g.achievements)&&Array.isArray(g.endings)){gallery={achievements:[...new Set([...gallery.achievements,...g.achievements.filter(x=>ACHIEVEMENTS.some(a=>a.id===x))])],endings:[...new Set([...gallery.endings,...g.endings.filter(x=>ENDINGS[x])])]}}s=data.game;s.name=s.name.slice(0,12);s.achievements=Array.isArray(s.achievements)?s.achievements:[];s.ap=clamp(s.ap,0,3);s.house=clamp(s.house||0,0,3);s.health=clamp(s.health||0,0,100);s.mood=clamp(s.mood||0,0,100);s.fame=clamp(s.fame||0,0,9999);s.seed=Number(s.seed)||12345;s.generation=clamp(s.generation||1,1,100);s.relations=s.relations||{yun:0,lin:0,lu:0,qiao:0};s.event=EVENTS.some(x=>x.id===s.event)?s.event:null;s.logs=s.logs.slice(0,120);s.retainers=s.retainers.filter(id=>RETAINERS.some(x=>x.id===id));s.relics=s.relics.filter(id=>RELICS.some(x=>x.id===id));s.children=s.children.slice(0,50);tab='home';modal=s.gameOver?{type:'ending'}:s.event?{type:'event'}:null;save();render();toast('存档已恢复')}catch(e){toast('导入失败：'+e.message)}}
function onClick(e){const t=e.target.closest('[data-cmd],[data-tab],[data-act],[data-event-choice],[data-gender],[data-origin],[data-trait],[data-heir]');if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;modal=null;render();scrollTo({top:0,behavior:'instant'});return}
 if(t.dataset.gender){options.gender=t.dataset.gender;const input=$('#name-input')?.value;renderModal();if(input!==undefined)$('#name-input').value=input;return}
 if(t.dataset.origin){options.origin=t.dataset.origin;const input=$('#name-input')?.value;renderModal();if(input!==undefined)$('#name-input').value=input;return}
 if(t.dataset.trait){options.trait=t.dataset.trait;const input=$('#name-input')?.value;renderModal();if(input!==undefined)$('#name-input').value=input;return}
 if(t.dataset.heir){mutate(()=>succession(t.dataset.heir));return}
 if(t.dataset.eventChoice!==undefined){respondEvent(Number(t.dataset.eventChoice));return}
 if(t.dataset.act){return}
 const cmd=t.dataset.cmd,id=t.dataset.id;
 switch(cmd){case'new':fresh();break;case'do-new':fresh();break;case'start':startGame();break;case'close':modal=null;render();break;case'settings':modal={type:'settings'};render();break;case'help':modal={type:'help'};render();break;case'confirm-new':modal={type:'confirm-new'};render();break;case'claim':claimGift();break;case'act':action(t.dataset.actId);break;case'next':annual();break;case'promote':promote();break;case'switch':switchJob(id);break;case'buy-shop':buyShop(id);break;case'sell-shop':sellShop(id);break;case'buy-home':buyHome(Number(t.dataset.tier));break;case'buy-relic':buyRelic(id);break;case'visit':visitNPC(id);break;case'propose':propose(id);break;case'child':haveChild();break;case'recruit':recruit(id);break;case'reform':reform();break;case'enthrone':enthrone();break;case'export':exportSave();break;case'record':case'end-record':modal=null;tab='record';render();break;case'retire':modal={type:'retire'};render();break;case'retire-now':end(chooseFinal());break;default:break}}
function boot(){let loaded=storeGet(SAVE);let g=storeGet(GALLERY);if(g&&Array.isArray(g.achievements)&&Array.isArray(g.endings))gallery=g;if(validateSave(loaded)){s=loaded;s.achievements=Array.isArray(s.achievements)?s.achievements:[];s.gameOver=!!s.gameOver;s.ap=0;s.school=s.school||(s.age<18?'蒙学在读':'已入世');s.ruleset='events-v4';modal=s.gameOver?{type:'ending'}:s.event?{type:'event'}:null;if(!modal&&STORY_EVENTS.some(e=>e.age===s.age&&!s.seenEvents.includes(e.id)))pickEvent()}else{modal={type:'create'}}render();document.addEventListener('click',onClick);document.addEventListener('change',e=>{if(e.target.id==='file-import'){importSave(e.target.files?.[0]);e.target.value=''}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal&&!['event','create','ending','succession'].includes(modal.type)){modal=null;render()}})}
boot();
window.__FUSHI_BRIDGE__={getState:()=>s,save:save,render:render,getModal:()=>modal,getEconomy:()=>s?{wage:annualWage(),shops:annualShops(),expense:annualExpense()}:{wage:0,shops:0,expense:0},annual:annual,check:checkState,triggerEvent:()=>{if(!s||s.event||modal||s.gameOver)return false;const ok=pickEvent();if(ok){save();render()}return ok},nextMilestone:()=>s?STORY_EVENTS.filter(e=>e.age>=s.age&&!s.seenEvents.includes(e.id)).sort((a,b)=>a.age-b.age)[0]:null};
window.__FUSHI_DEBUG__={getState:()=>structuredClone(s),getGallery:()=>structuredClone(gallery),getEvents:()=>EVENTS.map(x=>x.id)};
})();

</script>

<script>
/* Shelf shortcuts only read book metadata. No copyrighted book text is transferred or exposed. */
(function(){
  "use strict";
  const gu=document.getElementById("root-gu-book-state"),extra=document.getElementById("root-extra-books");
  if(!gu||!extra)return;
  function paint(items){
    if(!Array.isArray(items))return;
    gu.textContent="六卷 · 在线阅读 · 无需导入";
    extra.replaceChildren();
    for(const b of items.filter(b=>b&&b.id!=="gu-zhen-ren"&&b.title).slice(0,12)){
      const a=document.createElement("a");
      a.href="./books/";
      a.textContent=b.title+(b.count?" · "+b.count+"节":"");
      extra.appendChild(a);
    }
  }
  function refresh(){
    try{paint(JSON.parse(localStorage.getItem("paper-books-index-v1")||"[]"));}catch(e){}
    // If the user imported before this update, directly query existing IndexedDB.
    // Abort the upgrade when no database exists, so homepage visits never create a broken DB.
    if(!window.indexedDB)return;
    try{
      const req=indexedDB.open("paper-books-v1");
      req.onupgradeneeded=()=>req.transaction.abort();
      req.onsuccess=()=>{
        const d=req.result;
        if(!d.objectStoreNames.contains("books")){d.close();return;}
        const tx=d.transaction("books","readonly"),q=tx.objectStore("books").getAll();
        q.onsuccess=()=>paint(q.result);
        tx.oncomplete=()=>d.close();
      };
      req.onerror=()=>{};
    }catch(e){}
  }
  refresh();window.addEventListener("pageshow",refresh);
})();
</script>
